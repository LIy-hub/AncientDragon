name: Fabric version matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { minecraft: '1.21.1', family: legacy }
          - { minecraft: '1.21.2', family: legacy }
          - { minecraft: '1.21.3', family: legacy }
          - { minecraft: '1.21.4', family: legacy }
          - { minecraft: '1.21.5', family: legacy }
          - { minecraft: '1.21.6', family: legacy }
          - { minecraft: '1.21.7', family: legacy }
          - { minecraft: '1.21.8', family: legacy }
          - { minecraft: '1.21.9', family: modern }
          - { minecraft: '1.21.10', family: modern }
          - { minecraft: '1.21.11', family: modern }
          - { minecraft: '26.1', family: modern }
          - { minecraft: '26.1.1', family: modern }
          - { minecraft: '26.1.2', family: modern }
          - { minecraft: '26.2', family: modern }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build, test, and inspect the exact target JAR
        shell: pwsh
        run: >-
          .\gradlew.bat -p versions/${{ matrix.family }}
          "-Pminecraft_version=${{ matrix.minecraft }}"
          "-Dorg.gradle.java.installations.paths=$env:JAVA_HOME_21_X64,$env:JAVA_HOME_25_X64"
          --no-daemon --max-workers=1 build verifyRuntimeJar --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ancient-dragon-${{ matrix.minecraft }}
          path: versions/${{ matrix.family }}/build/${{ matrix.minecraft }}/libs/ancient-dragon-*.jar
          if-no-files-found: error
