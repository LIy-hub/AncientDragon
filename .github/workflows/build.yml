name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        shell: pwsh
        run: .\gradlew.bat clean check build --stacktrace

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ancient-dragon-${{ github.sha }}
          path: build/libs/ancient-dragon-*.jar
          if-no-files-found: error
