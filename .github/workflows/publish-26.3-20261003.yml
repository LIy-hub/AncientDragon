name: Publish verified Minecraft 26.3 artifacts
on:
  push:
    branches: ["codex/publish-26.3-20261003"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: LIy-hub/AncientDragon
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve immutable successful CI artifacts
        run: |
          mkdir -p .github/release-26.3/AncientDragon
          gh run download 37048476420 --dir .github/release-26.3/AncientDragon/ci-artifacts
          gh api repos/LIy-hub/AncientDragon/actions/runs/37048476420 > .github/release-26.3/AncientDragon/ci-run.json
          gh api repos/LIy-hub/AncientDragon/actions/runs/37048476420/artifacts > .github/release-26.3/AncientDragon/ci-artifact-metadata.json
          gh run view 37048476420 --log > .github/release-26.3/AncientDragon/ci.log
      - name: Validate original JAR bytes, metadata and test evidence
        run: python3 .github/release-26.3/stage_releases.py AncientDragon
      - name: Create verified prerelease draft
        run: |
          gh release create 'v0.1.0-beta.1+26.3' .github/release-26.3/AncientDragon/release/* --target 'bc6c5a5b77958c9bd979fbdcc7efbf9b2e47da1c' --title 'Ancient Dragon 0.1.0-beta.1 — Minecraft 26.3' --notes-file .github/release-26.3/AncientDragon/release-notes.md --draft --prerelease
      - name: Preserve publication verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-evidence-26.3
          path: |
            .github/release-26.3/AncientDragon/release/verification-manifest.json
            .github/release-26.3/AncientDragon/release/SHA256SUMS.txt
            .github/release-26.3/AncientDragon/release-notes.md
            .github/release-26.3/AncientDragon/ci-run.json
          if-no-files-found: warn
